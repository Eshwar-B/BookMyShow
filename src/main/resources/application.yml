spring:
  application:
    name: bookmyshow
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/bookmyshow?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.bookmyshow: DEBUG

security:
  jwt:
    # Base64-encoded key (for learning only; move to env var in production).
    secret: ${JWT_SECRET:Ym9va215c2hvdy1zZWNyZXQta2V5LWJvb2tteXNob3ctc2VjcmV0LWtleQ==}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
